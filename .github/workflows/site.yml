# Crawl the channel → commit new posts → publish the primary site (Cloudflare Pages, https://blog.remixt.app) right
# away → the model's headlines → publish → notify → the model's extras → publish → the GitHub Pages mirror.
# A crawl with nothing new stops after the commit step (and the model's backlog), so frequent runs cost little.
# Vercel (khabar-ai.vercel.app) is no longer deployed: its Hobby deployment is disabled.
# The data commit is pushed with GITHUB_TOKEN, which GitHub never lets start another run, so one trigger = one run.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: site

on:
  # GitHub delays or drops scheduled runs under load (gaps of several hours happen), worst on the hour and half hour,
  # so these sit off those minutes. It is best effort only: /api/watch (called every minute by an external cron, see
  # README) dispatches a run as soon as the channel has news. Keep this schedule as a fallback; a run with nothing new is cheap.
  schedule:
    - cron: '7,27,47 * * * *'
    # The channel posts its daily summary at ~07:36 Tehran (04:06 UTC), English first, then Persian two minutes later.
    # An extra run right after it puts the morning brief on the home page within minutes.
    - cron: '12 4 * * *'
  push:
    branches: [main]
    # Data and docs changes need no deploy from here: the next scheduled run publishes them.
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:
    inputs:
      pages:
        description: 't.me/s pages to crawl (≈20 posts each); use more to backfill older posts (e.g. 30 ≈ the last 600)'
        default: '3'

permissions:
  contents: write
  pages: write
  id-token: write
  # The site-health issue (scripts/health-issue.mjs).
  issues: write

# Two lanes. Data runs (schedule, /api/watch and /api/sync dispatches) crawl and commit, so they go one at a time; a
# group holds one pending run, so a newer dispatch replaces a queued one (nothing lost: each crawls main as it is). A
# code push only tests, builds and deploys main as it is (it crawls nothing), in its own lane: with the 1-minute watch
# dispatching, a push sharing the data lane was the pending run a dispatch replaced (cancelled, its e2e never ran).
concurrency:
  group: site-${{ github.event_name == 'push' && 'code' || 'data' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A backfill (workflow_dispatch with many pages) reads hundreds of posts and their links; a normal run takes a minute.
    timeout-minutes: 60
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
      # The site tests passed: the Pages artifact was uploaded.
      mirror: ${{ steps.sitetests.outcome == 'success' }}
    steps:
      # main as it is now, not the commit that triggered the run: a run can sit queued for over an hour, and crawling
      # on top of that old commit re-adds posts later runs already committed (add/add conflicts on data/posts).
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      # yt-dlp unpinned on purpose: YouTube changes often and only a current yt-dlp keeps up (pipeline/videos.py).
      # Network steps get three tries: a registry or t.me hiccup shouldn't fail a run the next minute would pass.
      - run: for i in 1 2 3; do pip install -q -r pipeline/requirements.txt pytest yt-dlp && exit 0; sleep $((i * 15)); done; exit 1
      # The scheduled run only adds data to code that already passed on its push.
      - run: python -m pytest -q pipeline/tests
        if: github.event_name != 'schedule'

      # A code push crawls nothing (see concurrency): the data runs do, one at a time.
      - name: Crawl channel
        if: github.event_name != 'push'
        run: |
          pages='${{ inputs.pages }}'
          # First run on an empty repo: backfill instead of reading only the newest pages.
          if [ -z "$pages" ] && ! ls data/posts/*.json >/dev/null 2>&1; then pages=10; fi
          pages="${pages:-3}"
          # Posts older than 48 hours get Gholam's translation from backfill_gholam, 40 per run by default: a backfill
          # looks for all of them at once, so the older posts arrive in Persian (and listed) in the same run.
          backfill=40; [ "$pages" -gt 3 ] && backfill=$((pages * 20))
          # t.me is often slow from the runners: try three times (the crawl only writes complete posts, so a retry is safe).
          for i in 1 2 3; do
            PAGES="$pages" GHOLAM_BACKFILL="$backfill" python -m pipeline.run && exit 0
            echo "::warning::crawl attempt $i failed"; sleep $((i * 30))
          done
          exit 1

      # Mehrzad's YouTube channel → data/videos.json (/videos/): the whole list once a day, or now when a post shares a
      # video it doesn't have yet. Never fails the run: the site keeps the list it has.
      - name: Videos
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 8
        run: python -m pipeline.videos

      # The model's work, on this runner (PLAN.md P1-B, P2): free — public repo, standard runner, the models (Qwen3.5-9B,
      # 5.7 GB, and a 0.6 GB embedding model) in the Actions cache, keyed on the pins in scripts/ai-server.sh. All of it is
      # written into data/ before the commit, so no extra deploy. Never fails the run: the site falls back to the rules'
      # headline and shared topics, and whatever the time budgets leave is done on the next run, newest first.
      # Publish first: the crawl's news goes live in a few minutes, before the model's work (which takes up to ~15).
      # The model's headline replaces Gholam's first sentence a few minutes later, on the next publish below.
      - name: Commit new posts
        id: commit
        if: github.event_name != 'push'
        run: scripts/commit-data.sh | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: for i in 1 2 3; do npm ci --no-audit --no-fund && exit 0; sleep $((i * 15)); done; exit 1
      - run: npm test
        if: github.event_name == 'push'
      - name: Publish (Cloudflare Pages, the primary site)
        id: publish
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: scripts/publish.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'khabar' }}

      # The model's work, on this runner (PLAN.md P1-B, P2): free — public repo, standard runner, the models (Qwen3.5-9B,
      # 5.7 GB, and a 0.6 GB embedding model) in the Actions cache, keyed on the pins in scripts/ai-server.sh. Never fails
      # the run: the site falls back to the rules' headline and shared topics, and whatever the time budgets leave is
      # done on the next run, newest first. In two passes, each published when it changed something: what readers see
      # first (headlines, translations), then the extras.
      - name: Posts waiting for the model
        id: ai
        if: github.event_name != 'push'
        run: |
          core=$(python -m pipeline.ai --pending)
          en=$(python -m pipeline.ai_en --pending)
          more=$(python -m pipeline.ai_more --pending --total)
          threads=$(python -m pipeline.threads --pending)
          # New stories also need their vectors (related stories) and the podcast's host lines.
          news=$([ '${{ steps.commit.outputs.changed }}' = true ] && echo 1 || echo 0)
          echo "core=$core" | tee -a "$GITHUB_OUTPUT"
          echo "pending=$((core + en + more + threads + news))" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.ai.outputs.pending > 0
        with:
          path: ~/.cache/khabar-ai
          key: ai-${{ runner.os }}-${{ hashFiles('scripts/ai-server.sh') }}
      # The stories' vectors (pipeline/related.py): small, rebuilt if evicted, a new entry per run (a cache key is immutable).
      - uses: actions/cache@v6
        if: steps.ai.outputs.pending > 0
        with:
          path: ~/.cache/khabar-vectors
          key: vectors-${{ github.run_id }}
          restore-keys: vectors-
      - name: AI, first pass (headlines in both languages, translations)
        if: steps.ai.outputs.pending > 0
        continue-on-error: true
        timeout-minutes: 10
        env:
          AI_BUDGET: '240'
        run: |
          scripts/ai-server.sh
          step() { "$@" || echo "::warning::$* failed"; }
          # A post Gholam never translated gets the model's story first: its headline and extras read it.
          step python -m pipeline.ai_more --only=story
          step python -m pipeline.ai
          # The English edition's headlines (pipeline/ai_en.py): a few seconds a post.
          AI_EN_BUDGET=90 step python -m pipeline.ai_en
      - name: Commit the model's headlines
        id: commit_ai
        if: steps.ai.outputs.pending > 0
        run: |
          scripts/commit-data.sh "data: AI headlines $(date -u +%Y-%m-%dT%H:%MZ)" | tee -a "$GITHUB_OUTPUT"
      - name: Publish the headlines
        if: steps.commit_ai.outputs.changed == 'true'
        continue-on-error: true
        run: scripts/publish.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'khabar' }}

      # Readers with notifications on, and search engines (IndexNow), hear about the new stories once the site serves
      # them (scripts/notify.mjs waits for recent.json to list them), with the model's headlines when it had time.
      - id: latest
        if: steps.publish.outcome != '' && steps.publish.outcome != 'skipped' && github.event_name != 'push'
        run: echo "latest=$(node -p "require('./dist/build.json').latest")" >> "$GITHUB_OUTPUT"
      - name: Notify
        if: steps.latest.outputs.latest != ''
        continue-on-error: true
        timeout-minutes: 12
        run: node scripts/notify.mjs
        env:
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          SITE: ${{ vars.API_URL || 'https://blog.remixt.app' }}
          LATEST: ${{ steps.latest.outputs.latest }}

      - name: AI, second pass (extras, voices' names, related, threads, podcast, video summaries, comment checks)
        if: steps.ai.outputs.pending > 0
        continue-on-error: true
        timeout-minutes: 22
        env:
          AI_MORE_BUDGET: '240'
          PYTHONUNBUFFERED: '1'
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          KV_PREFIX: ${{ vars.KV_PREFIX }}
        run: |
          curl -sf -m 2 http://127.0.0.1:8080/health >/dev/null || scripts/ai-server.sh
          # Each tool gets its own cap (SIGINT, then KILL 20 s later), so one slow answer can't starve the ones after it
          # (11-25: a daily brief ran into the step's limit and the videos and comment checks never ran).
          step() { s=$1; shift; timeout -s INT -k 20 "$s" "$@" || echo "::warning::$* failed or ran out of time (${s}s)"; }
          step 420 python -m pipeline.ai_more
          step 120 python -m pipeline.related
          # Each thread's name and «ماجرا تا اینجا» (pipeline/threads.py): only threads that grew.
          step 180 python -m pipeline.threads
          step 420 python -m pipeline.daily
          step 240 python -m pipeline.videos --summarize --limit=1
          step 120 python -m pipeline.comments
      - name: Commit the extras
        id: commit_more
        if: steps.ai.outputs.pending > 0
        run: |
          scripts/commit-data.sh "data: AI extras $(date -u +%Y-%m-%dT%H:%MZ)" | tee -a "$GITHUB_OUTPUT"
      - name: Publish the extras
        if: steps.commit_more.outputs.changed == 'true'
        continue-on-error: true
        run: scripts/publish.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PROJECT || 'khabar' }}

      # The GitHub Pages mirror: its own build (its address and base path), checked by the site tests first.
      - id: deploy
        run: echo "deploy=${{ github.event_name == 'push' || steps.commit.outputs.changed == 'true' || steps.commit_ai.outputs.changed == 'true' || steps.commit_more.outputs.changed == 'true' }}" >> "$GITHUB_OUTPUT"
      - id: pages
        if: steps.deploy.outputs.deploy == 'true'
        uses: actions/configure-pages@v6
      - name: Build the mirror
        if: steps.deploy.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The mirror has no functions of its own: comments, reactions and chat go to the primary site's API.
          PUBLIC_API_URL: ${{ vars.API_URL || 'https://blog.remixt.app' }}
        run: npm run build
      # The built timeline and stories against the crawled data: order, days, times and counts (tests/site.test.mjs).
      # On a code push a failure fails the run. On a data run it holds the Pages mirror back (it keeps its last good
      # build; the primary site serves the data regardless) and is reported once, in the site-health issue, which closes
      # itself when they pass again — not as a red run and an email every 20 minutes.
      - id: sitetests
        name: Site tests
        if: steps.deploy.outputs.deploy == 'true'
        continue-on-error: ${{ github.event_name != 'push' }}
        env:
          # The tests read the mirror's build: its own links and its sitemap carry its address.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -o pipefail
          node --test tests/site.test.mjs 2>&1 | tee site-tests.log
      - name: Site health issue
        if: always() && steps.sitetests.outcome != '' && steps.sitetests.outcome != 'skipped' && github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/health-issue.mjs ${{ steps.sitetests.outcome }} site-tests.log

      - uses: actions/upload-pages-artifact@v5
        if: steps.deploy.outputs.deploy == 'true' && steps.sitetests.outcome == 'success'
        with:
          path: dist

  # Code pushes only: the built site in a real Chrome (tests/e2e/smoke.mjs) — every kind of page without a script error,
  # the voice sheet, a news video made and played back, made in the background, an episode teaser. A data run changes
  # no code, so it doesn't run this. Beside the build, not in front of it: a red X on the push is the signal.
  e2e:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: for i in 1 2 3; do npm ci --no-audit --no-fund && exit 0; sleep $((i * 15)); done; exit 1
      - run: npm run build
      # The runner's own Google Chrome (Playwright's `chrome` channel): no browser download.
      - run: node tests/e2e/smoke.mjs

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true' && needs.build.outputs.mirror == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub Pages now and then sits in "updating_pages" until deploy-pages times out (10 min) and cancels it; the
      # same artifact usually goes through on a second try, so retry once. Pages is only the mirror (Vercel is primary)
      # and the next crawl redeploys, so a second timeout is a warning, not a failed run (and a failure email).
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - id: retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - if: steps.retry.outcome == 'failure'
        run: echo "::warning::GitHub Pages stayed in updating_pages twice; the mirror updates on the next deploy."
