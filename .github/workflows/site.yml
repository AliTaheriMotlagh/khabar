# Every 20 minutes: crawl the channel → commit new posts to data/ → build → deploy GitHub Pages.
# A crawl with nothing new stops after the commit step, so frequent runs cost well under a minute.
# Vercel (the primary site, https://khabar-ai.vercel.app) redeploys by itself on each data commit to main.
# The data commit is pushed with GITHUB_TOKEN, which GitHub never lets start another run, so one trigger = one run.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: site

on:
  # GitHub delays or drops scheduled runs under load (gaps of several hours happen), worst on the hour and half hour,
  # so these sit off those minutes. It is best effort only: /api/watch (called every minute by an external cron, see
  # README) dispatches a run as soon as the channel has news. Keep this schedule as a fallback; a run with nothing new is cheap.
  schedule:
    - cron: '7,27,47 * * * *'
    # The channel posts its daily summary at ~07:36 Tehran (04:06 UTC), English first, then Persian two minutes later.
    # An extra run right after it puts the morning brief on the home page within minutes.
    - cron: '12 4 * * *'
  push:
    branches: [main]
    # Data and docs changes need no deploy from here: the next scheduled run publishes them.
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:
    inputs:
      pages:
        description: 't.me/s pages to crawl (≈20 posts each); use more to backfill older posts (e.g. 30 ≈ the last 600)'
        default: '3'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A backfill (workflow_dispatch with many pages) reads hundreds of posts and their links; a normal run takes a minute.
    timeout-minutes: 45
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      # The scheduled run only adds data to code that already passed on its push.
      - run: python -m pytest -q pipeline/tests
        if: github.event_name != 'schedule'

      - name: Crawl channel
        # A code push should still deploy if t.me is unreachable; scheduled runs should fail loudly.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          pages='${{ inputs.pages }}'
          # First run on an empty repo: backfill instead of reading only the newest pages.
          if [ -z "$pages" ] && ! ls data/posts/*.json >/dev/null 2>&1; then pages=10; fi
          pages="${pages:-3}"
          # Posts older than 48 hours get Gholam's translation from backfill_gholam, 40 per run by default: a backfill
          # looks for all of them at once, so the older posts arrive in Persian (and listed) in the same run.
          backfill=40; [ "$pages" -gt 3 ] && backfill=$((pages * 20))
          PAGES="$pages" GHOLAM_BACKFILL="$backfill" python -m pipeline.run

      - name: Commit new posts
        id: commit
        run: |
          # A code push always deploys; a crawl only when it brought something new.
          [ '${{ github.event_name }}' = push ] && echo deploy=true >> "$GITHUB_OUTPUT"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet && { echo 'nothing new'; exit 0; }
          git commit -qm "data: crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          # A push to main can land mid-run; rebase onto it and try again instead of losing the crawl.
          for attempt in 1 2 3; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then
              echo deploy=true >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/setup-node@v4
        if: steps.commit.outputs.deploy == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.commit.outputs.deploy == 'true'
      - run: npm test
        if: github.event_name == 'push'

      - id: pages
        if: steps.commit.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Build
        if: steps.commit.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The mirror has no functions of its own: comments, reactions and chat go to the Vercel API.
          PUBLIC_API_URL: ${{ vars.API_URL || 'https://khabar-ai.vercel.app' }}
        run: npm run build
      # The built timeline and stories against the crawled data: order, days, times and counts (tests/site.test.mjs).
      - run: node --test tests/site.test.mjs
        if: steps.commit.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.deploy == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
