# Every 15 minutes: crawl the channel → commit new posts to data/ → build → deploy GitHub Pages.
# Vercel (the primary site, https://alitaherimotlagh.vercel.app) redeploys by itself on each data commit to main.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: site

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages:
        description: 't.me/s pages to crawl (≈20 posts each); use more to backfill'
        default: '3'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - run: python -m pytest -q pipeline/tests

      - name: Crawl channel
        # A code push should still deploy if t.me is unreachable; scheduled runs should fail loudly.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          pages='${{ inputs.pages }}'
          # First run on an empty repo: backfill instead of reading only the newest pages.
          if [ -z "$pages" ] && ! ls data/posts/*.json >/dev/null 2>&1; then pages=10; fi
          PAGES="${pages:-3}" python -m pipeline.run

      - name: Commit new posts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -qm "data: crawl $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase -q origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The mirror has no functions of its own: comments, reactions and chat go to the Vercel API.
          PUBLIC_API_URL: ${{ vars.API_URL || 'https://alitaherimotlagh.vercel.app' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
