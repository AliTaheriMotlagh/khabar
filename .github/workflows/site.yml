# Crawl the channel → commit data/ to main and media to the orphan "media" branch → build → deploy to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# Vercel (optional) deploys on its own from the data commits this pushes to main; see README.
name: site

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pages:
        description: 't.me/s pages to crawl (≈20 posts each); use more to backfill'
        default: '1'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out media store
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin media >/dev/null; then
            git clone --depth 1 --branch media --single-branch "$REPO_URL" media-store
          else
            git init -b media media-store
            git -C media-store remote add origin "$REPO_URL"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - run: python -m pytest -q pipeline/tests

      - name: Crawl channel
        # A code push should still deploy if t.me is unreachable; scheduled runs should fail loudly.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          pages='${{ inputs.pages }}'
          # First run on an empty repo: backfill instead of reading only the newest page.
          if [ -z "$pages" ] && ! ls data/posts/*.json >/dev/null 2>&1; then pages=10; fi
          PAGES="${pages:-1}" python -m pipeline.run

      - name: Commit data and media
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898283+github-actions[bot]@users.noreply.github.com'
          stamp=$(date -u +%Y-%m-%dT%H:%MZ)

          # Media: always a single root commit, so old/pruned files don't pile up in history.
          cd media-store
          if [ -n "$(git status --porcelain)" ]; then
            git checkout --orphan next
            git add -A
            git commit -qm "media $stamp"
            git push -f origin HEAD:media
          fi
          cd ..

          git add data
          if ! git diff --cached --quiet; then
            git commit -qm "data: crawl $stamp"
            git pull --rebase -q origin main
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
