# Hourly: crawl the channel → commit new posts to data/ → build → deploy GitHub Pages.
# Vercel (the primary site, https://khabar-ai.vercel.app) redeploys by itself on each data commit to main.
# The data commit is pushed with GITHUB_TOKEN, which GitHub never lets start another run, so one trigger = one run.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: site

on:
  # GitHub delays or drops scheduled runs under load, worst on the hour and half hour, so this sits off those minutes.
  # It is best effort only. For an exact cadence call workflow_dispatch from an external cron (see README) and delete
  # this schedule, otherwise both fire and every hour runs twice.
  schedule:
    - cron: '17 * * * *'
    # The channel posts its daily summary at ~07:36 Tehran (04:06 UTC), English first, then Persian two minutes later.
    # Two extra runs right after it put the morning brief on the home page within minutes, even if one is delayed.
    - cron: '12 4 * * *'
    - cron: '32 4 * * *'
  push:
    branches: [main]
    # Data and docs changes need no deploy from here: the next scheduled run publishes them.
    paths-ignore: ['data/**', '**.md']
  workflow_dispatch:
    inputs:
      pages:
        description: 't.me/s pages to crawl (≈20 posts each); use more to backfill'
        default: '3'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      # The scheduled run only adds data to code that already passed on its push.
      - run: python -m pytest -q pipeline/tests
        if: github.event_name != 'schedule'

      - name: Crawl channel
        # A code push should still deploy if t.me is unreachable; scheduled runs should fail loudly.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          pages='${{ inputs.pages }}'
          # First run on an empty repo: backfill instead of reading only the newest pages.
          if [ -z "$pages" ] && ! ls data/posts/*.json >/dev/null 2>&1; then pages=10; fi
          PAGES="${pages:-3}" python -m pipeline.run

      - name: Commit new posts
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data
          git diff --cached --quiet && exit 0
          git commit -qm "data: crawl $(date -u +%Y-%m-%dT%H:%MZ)"
          # A push to main can land mid-run; rebase onto it and try again instead of losing the crawl.
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        if: github.event_name != 'schedule'

      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # The mirror has no functions of its own: comments, reactions and chat go to the Vercel API.
          PUBLIC_API_URL: ${{ vars.API_URL || 'https://khabar-ai.vercel.app' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
