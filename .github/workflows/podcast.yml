# «پادکست خبر» every morning (07:30 Tehran): yesterday's stories as a talk between Gholam and Parisa, written by the
# model on the runner (pipeline/podcast.py; a fixed exchange from the story's own sentences wherever the model's fails
# its checks), spoken by the live site's studio page with the site's own voices (scripts/podcast.mjs), published to R2
# (functions/media) and to the feed (/podcast.xml), then the site redeployed so /podcast/ plays it. Free: public repo,
# standard runner, the model and the voices from the Actions cache. Needs MEDIA_KEY (as the Pages secret) and, to
# redeploy, CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (the crawl's).
name: podcast

on:
  schedule:
    - cron: '0 4 * * *' # 07:30 Tehran
  workflow_dispatch:
    inputs:
      day:
        description: 'Tehran day (YYYY-MM-DD); empty: yesterday'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - uses: actions/cache@v6
        with:
          path: ~/.cache/khabar-ai
          key: ai-${{ runner.os }}-${{ hashFiles('scripts/ai-server.sh') }}
      - run: SERVE=llm scripts/ai-server.sh
      - name: Write the talk
        run: python -m pipeline.podcast ${{ inputs.day && format('--day {0}', inputs.day) || '--yesterday' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: for i in 1 2 3; do npm ci --no-audit --no-fund && break; sleep $((i * 20)); done
      - name: The Chrome profile with the voices
        uses: actions/cache@v6
        with:
          path: .cache/film-profile
          key: podcast-profile-v1-${{ github.run_id }}
          restore-keys: |
            podcast-profile-v1-
            film-profile-v1-
      - name: Make the sound and publish it
        id: sound
        env:
          SITE: ${{ vars.API_URL || 'https://blog.remixt.app' }}
          MEDIA_KEY: ${{ secrets.MEDIA_KEY }}
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          [ -n "$MEDIA_KEY" ] || { echo "::warning::MEDIA_KEY is not set: the episode's sound can't be published"; exit 0; }
          day="${{ inputs.day }}"
          [ -n "$day" ] || day=$(TZ=Asia/Tehran date -d yesterday +%F)
          [ -f "data/podcast/$day.json" ] || { echo "no episode for $day"; exit 0; }
          node scripts/podcast.mjs --day "$day"
          echo "day=$day" >> "$GITHUB_OUTPUT"
      - name: Commit the episode
        run: |
          git add data/podcast
          git diff --cached --quiet && { echo 'nothing new'; exit 0; }
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit -qm "data: podcast ${{ steps.sound.outputs.day }}"
          for attempt in 1 2 3 4; do
            if git pull --rebase -q origin main && git push -q origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
      - name: Redeploy (the page and the feed list it)
        if: steps.sound.outputs.day != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/publish.sh
