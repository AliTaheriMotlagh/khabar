# Deletes old Vercel deployments (scripts/vercel-prune.mjs): once a day as a backstop to the site workflow's `prune`
# job, which only runs after a deploy, and by hand (Actions → prune → Run workflow; "dry run" only lists them).
name: prune

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - run: node scripts/vercel-prune.mjs
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID || secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'khabar-ai' }}
          SITE: ${{ vars.API_URL || 'https://khabar-ai.vercel.app' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
