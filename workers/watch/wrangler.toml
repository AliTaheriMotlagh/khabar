# The crawl's 1-minute trigger: a Cloudflare Worker with a cron trigger (Workers Free includes cron triggers; ~1,440
# runs a day, plus as many /api/watch calls, of the 100,000 requests/day the account shares with the site's Functions).
# It replaces the external cron (cron-job.org), which kept calling the dead Vercel address.
# Deploy once (and after changing this folder): npx wrangler@4 deploy -c workers/watch/wrangler.toml
name = "khabar-watch"
main = "index.js"
compatibility_date = "2025-09-01"
# No public address: it only runs on its schedule.
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

[vars]
WATCH_URL = "https://blog.remixt.app/api/watch/"
