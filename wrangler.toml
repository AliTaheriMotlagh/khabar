# Cloudflare Pages (https://blog.remixt.app). Deployed from GitHub Actions (site.yml, job `cloudflare`) with
# `wrangler pages deploy`, not Cloudflare's Git builds (free plan: 500 builds/month, the crawl alone makes ~2,000).
name = "khabar"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
